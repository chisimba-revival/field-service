# The databases this service needs, and nothing else.
#
# The design calls for PostgreSQL with PostGIS and a Redis. This file exists so
# that is reproducible rather than something somebody set up once on a machine
# and then could not rebuild. The schema itself is not here: it is applied by
# migrations, so that the order they run in is recorded in the repository.
#
# Ports are published directly rather than reached through a tunnel container.
# A tunnel is only necessary when the database container does not publish a
# port, and it adds a process whose failure looks like the database failing.
#
# These ports are deliberately not the defaults. 5432 and 6379 collide with
# whatever else is running on the machine, and the failure mode of that
# collision is another project's service failing in a confusing way.

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: fieldsvc
      POSTGRES_PASSWORD: fieldsvc
      POSTGRES_DB: fieldlog
      # PostGIS refuses to initialise its extension scripts on a database whose
      # locale is not set, and the failure is a confusing one. Setting it here
      # means a fresh volume comes up with spatial support already present.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Refusing connections is not the same as being unable to answer them, so
      # this asks a question rather than testing the port.
      test: ["CMD-SHELL", "pg_isready -U fieldsvc -d fieldlog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # The design's admission test for anything in Redis is that it is never the
    # only copy of anything, which is what lets it be configured to evict rather
    # than to persist. If that ever stops being true this line is the first
    # thing that needs revisiting.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot schema migration. It runs to completion before field-service
  # starts, so a fresh volume comes up with a schema rather than a connection
  # error. The PostGIS image is reused only for its psql client; the migration
  # files are the ones in the repository, so the order they run in is recorded
  # in git rather than in somebody's shell history.
  migrate:
    image: postgis/postgis:16-3.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: fieldsvc
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/migrate.sh"]
    command: ["postgres://fieldsvc:fieldsvc@postgres:5432/fieldlog?sslmode=disable"]
    restart: "no"

  # The service itself. Its own PostGIS and Redis are reached over this
  # project's default network; Chisimba's JWKS is reached over the external
  # chisimba-dev network, where the web service is named `web`. It connects to
  # Postgres as the fieldapp runtime role, never the migration superuser, so
  # row-level security actually applies (see migrations/0002_runtime_role.sql).
  field-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: field-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      FIELDSVC_DATABASE_URL: postgres://fieldapp:fieldsvc@postgres:5432/fieldlog?sslmode=disable
      FIELDSVC_REDIS_ADDR: redis:6379
      FIELDSVC_JWKS_URL: http://web/api/v1/auth/jwks
      # These must match the claims Chisimba signs. They are the values in
      # TokenAuthService ($issuer = 'chisimba', $audience = 'chisimba-api'),
      # not the stale examples in FIELD_SERVICE_INTEGRATION_FINAL.md. A
      # mismatch fails closed: every token is refused.
      FIELDSVC_ISSUER: chisimba
      FIELDSVC_AUDIENCE: chisimba-api
      FIELDSVC_LISTEN: ":8080"
      FIELDSVC_REQUIRED_SCOPE: field:write
    ports:
      - "8081:8080"
    networks:
      - default
      - chisimba
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
  # The network the Chisimba stack (project `chisimba-dev`) creates. Marked
  # external because this compose file does not own it; it must already be
  # running, which it is whenever `web` is up.
  chisimba:
    external: true
    name: chisimba-dev_default
